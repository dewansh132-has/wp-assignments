<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>image slider infinite</title>
  <link rel="stylesheet" href="practice5.css">
</head>
<body>

  <div class="slider">
    <div class="slide-track">
      <!-- Original Images -->
      <div class="slide"><img src="https://picsum.photos/id/1015/600/400" /></div>
      <div class="slide"><img src="https://picsum.photos/id/1016/600/400" /></div>
      <div class="slide"><img src="https://picsum.photos/id/1018/600/400" /></div>
      <div class="slide"><img src="https://picsum.photos/id/1020/600/400" /></div>

      <!-- Duplicate Images infinite effect -->
      <div class="slide"><img src="https://picsum.photos/id/1015/600/400" /></div>
      <div class="slide"><img src="https://picsum.photos/id/1016/600/400" /></div>
      <div class="slide"><img src="https://picsum.photos/id/1018/600/400" /></div>
      <div class="slide"><img src="https://picsum.photos/id/1020/600/400" /></div>
    </div>
  </div>

</body>
</html>
